<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ark Commands</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bruno+Ace&family=Montserrat:wght@600&family=Roboto+Flex:opsz,wght@8..144,100..1000&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body,
        html {
            height: 100%;
            background-color: black;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        /* Navbar */
        nav {
            position: fixed;
            top: 0;
            width: 90%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 40px 30px;
            z-index: 5;
        }

        nav .logo {
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 64px;
        }

        nav ul li a {
            color: #fff;
            text-decoration: none;
            font-family: "Roboto Mono", monospace;
            font-weight: 200;
            font-size: 18px;
            transition: color 0.3s;
        }

        nav ul li a:hover {
            color: #c4c4c4;
        }

        .discord-btn {
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;

        }

        img {
            width: 100%;
        }

        /* Hero Section */
        .hero {
            position: relative;
            width: 100%;
            height: 100vh;
            background: url('./image/bg-2.png') center/cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: #fff;
            text-align: center;
            padding-bottom: 130px;
            /* space for navbar */
        }

        /* Blur only at top */
        .blur-top {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50%;
            backdrop-filter: blur(15px);
            mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 1), rgba(0, 0, 0, 1), rgba(0, 0, 0, 0));
            -webkit-mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 1), rgba(0, 0, 0, 1), rgba(0, 0, 0, 0));
            z-index: 1;
        }

        /* Dark overlay */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.1);
            z-index: 2;
        }

        /* Hero content */
        .content {
            position: relative;
            z-index: 3;

            padding: 0 20px;
        }

        .content h1 {
            font-size: 96px;
            font-family: "Roboto Flex", sans-serif;
            font-weight: bold;
            width: 100%;
            margin-bottom: 1rem;
            /* Gradient color */
            background: radial-gradient(circle, #ffffff 0%, #999999 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            /* for some modern browsers */
        }


        .content p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            color: hsl(0, 0%, 90%);
        }

     
     

        /* Responsive */
        @media (max-width: 768px) {
            .content h1 {
                font-size: 44px;
            }

            .content p {
                font-size: 16px;
            }

            nav ul {
                gap: 40px;
                row-gap: 20px;
                display: flex;
          
                align-items: center;
                justify-content: center;
                flex-wrap: wrap;
            }
        }
          @media (max-width: 400px) {
            .content h1 {
                font-size: 36px;
            }

            .content p {
                font-size: 16px;
            }

            nav ul {
                gap: 40px;
                row-gap: 20px;
                display: flex;
                width: 50%;
                align-items: center;
                justify-content: center;
                flex-wrap: wrap;
            }
        }
    </style>
</head>

        </ul>
        <div class="discord-btn">

    <!-- Hero Section -->

        <div class="overlay"></div>
        <div class="content">
